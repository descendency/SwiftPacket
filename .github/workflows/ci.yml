name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: macOS (Swift 6)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release

  linux:
    name: Linux (Swift 6, ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["swift:6.0", "swift:6.1"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: apt-get update && apt-get install -y libpcap-dev
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
