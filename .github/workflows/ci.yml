name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: macOS (Swift 6)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release

  linux:
    name: Linux (Swift 6, ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["swift:6.0", "swift:6.1"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap and libcap tools
        run: apt-get update && apt-get install -y libpcap-dev libcap2-bin
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Build tests
        run: swift build --build-tests
      # Grant the test runner the capabilities packet capture needs
      # (CAP_NET_RAW to open AF_PACKET sockets, CAP_NET_ADMIN for promiscuous
      # mode / fanout), so capture-path tests can run without full root. The
      # swift:* containers already run as root, so this is belt-and-suspenders
      # and never fails the job if the runner isn't found.
      - name: Grant capture capabilities to the test runner
        run: |
          runner=$(find .build -type f -name '*PackageTests.xctest' | head -n1)
          if [ -n "$runner" ]; then
            setcap cap_net_raw,cap_net_admin+eip "$runner"
            echo "granted CAP_NET_RAW,CAP_NET_ADMIN to $runner"
          else
            echo "test runner not found; skipping setcap"
          fi
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
